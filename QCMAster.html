<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Master - Mode Surprise</title>
    <style>
        :root { --p: #1b4332; --s: #40916c; --a: #ff9f1c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: #081c15; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--bg); width: 92%; max-width: 450px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; overflow: hidden; position: relative; }
        .header-img { width: 100%; height: 160px; object-fit: cover; border-bottom: 4px solid var(--s); transition: 0.5s; }
        .content { padding: 20px; }
        .menu-btn { background: white; border: 2px solid var(--s); color: var(--p); padding: 15px; margin: 8px 0; border-radius: 15px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; font-size: 1rem; box-shadow: 0 4px 0 var(--s); }
        .menu-btn:active { transform: translateY(3px); box-shadow: none; }
        .special-btn { background: var(--a); border-color: #e67e22; color: white; box-shadow: 0 4px 0 #d35400; }
        .question { font-size: 1.1rem; font-weight: bold; margin: 15px 0; color: #222; min-height: 50px; }
        .ans-btn { background: #fff; border: 1px solid #ccc; padding: 12px; margin: 6px 0; width: 100%; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .correct { background: #40916c !important; color: white; border-color: #1b4332; }
        .wrong { background: #d00000 !important; color: white; border-color: #800000; }
        #expla-box { background: #e3f2fd; border-radius: 10px; padding: 12px; margin-top: 15px; text-align: left; font-size: 0.85rem; border-left: 4px solid #2196f3; display: none; line-height: 1.4; }
        #next-btn { background: var(--p); color: white; border: none; padding: 15px; border-radius: 12px; margin-top: 15px; width: 100%; font-weight: bold; display: none; cursor: pointer; }
        .score-box { font-size: 4rem; color: var(--p); font-weight: bold; }
        .hidden { display: none !important; }
        .fade { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container fade">
    <img id="top-img" class="header-img" src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=500" alt="Nature">
    <div class="content">
        <div id="home">
            <h1 style="color:var(--p); margin-bottom:5px;">🌿 Nature Master</h1>
            <p style="margin-top:0;">Deviens un expert de la planète</p>
            <button class="menu-btn" onclick="start(0)">🐾 Animaux Sauvages</button>
            <button class="menu-btn" onclick="start(1)">🌳 Forêts & Plantes</button>
            <button class="menu-btn" onclick="start(2)">🌊 Océans & Climat</button>
            <button class="menu-btn special-btn" onclick="startSurprise()">✨ MODE SURPRISE (Mix)</button>
        </div>

        <div id="quiz" class="hidden">
            <div id="progress" style="font-size: 0.8rem; color: var(--s); font-weight: bold;"></div>
            <div id="q-text" class="question"></div>
            <div id="ans-list"></div>
            <div id="expla-box" class="fade"><b>💡 Info :</b> <span id="expla-text"></span></div>
            <button id="next-btn" onclick="next()">Question Suivante ➔</button>
        </div>

        <div id="result" class="hidden">
            <h2 id="res-title">Résultat</h2>
            <div class="score-box" id="note"></div>
            <p id="comment" style="font-weight:bold;"></p>
            <button class="menu-btn" onclick="location.reload()">Retour au Menu</button>
        </div>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function play(f1, f2) {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(f1, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.05, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.2);
}

// Les données restent les mêmes (60 questions au total)
const data = [
    [ // ANIMAUX
        {q:"Quel est l'animal le plus rapide en plongée ?", a:["Guépard", "Faucon Pèlerin", "Espadon"], c:1, e:"Le faucon pèlerin atteint plus de 300 km/h en piqué.", img:"https://images.unsplash.com/photo-1611613219211-192534f37803?w=500"},
        {q:"Combien de cœurs possède une pieuvre ?", a:["1", "2", "3"], c:2, e:"Elle a deux cœurs branchiaux et un cœur systémique.", img:"https://images.unsplash.com/photo-1545671913-b89ac1b4ac10?w=500"},
        {q:"Le bourdon peut-il piquer ?", a:["Oui", "Non", "Seulement les mâles"], c:0, e:"Oui, la femelle bourdon possède un dard, mais elle est très paisible.", img:"https://images.unsplash.com/photo-1563630403666-6091350a453e?w=500"},
        {q:"Quel mammifère pond des œufs ?", a:["L'ornithorynque", "Le koala", "Le paresseux"], c:0, e:"C'est un monotrème : un mammifère qui pond des œufs mais allaite ses petits.", img:"https://images.unsplash.com/photo-1545199347-817cc396556f?w=500"},
        {q:"L'éléphant a peur des souris : vrai ou faux ?", a:["Vrai", "Faux", "Seulement les bébés"], c:1, e:"C'est un mythe. En revanche, ils craignent les abeilles !", img:"https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=500"},
        {q:"Quel oiseau vole en arrière ?", a:["Hirondelle", "Colibri", "Martinet"], c:1, e:"Grâce à ses ailes battant 80 fois par seconde.", img:"https://images.unsplash.com/photo-1452570053594-1b985d6ea890?w=500"},
        {q:"Combien de pattes ont les insectes ?", a:["6", "8", "10"], c:0, e:"C'est ce qui les distingue des arachnides (8 pattes).", img:"https://images.unsplash.com/photo-1518562180175-34a163b1a9a6?w=500"},
        {q:"Le requin est-il un poisson ou un mammifère ?", a:["Poisson", "Mammifère", "Reptile"], c:0, e:"C'est un poisson cartilagineux.", img:"https://images.unsplash.com/photo-1560273074-c93173de7563?w=500"},
        {q:"Quel animal ne peut pas sauter ?", a:["L'éléphant", "Le kangourou", "Le lièvre"], c:0, e:"Ses os sont trop massifs pour supporter l'impact d'un saut.", img:"https://images.unsplash.com/photo-1581031634842-fc6e2882f830?w=500"},
        {q:"Combien de temps dort un lion par jour ?", a:["8h", "12h", "20h"], c:2, e:"Les lions sont très économes en énergie entre deux chasses.", img:"https://images.unsplash.com/photo-1614027164847-1b2809eb18e4?w=500"},
        {q:"Le panda mange surtout du...", a:["Riz", "Bambou", "Poisson"], c:1, e:"Il en consomme jusqu'à 12kg par jour.", img:"https://images.unsplash.com/photo-1564349683136-77e08bef1ef1?w=500"},
        {q:"L'ours polaire a la peau...", a:["Blanche", "Noire", "Rose"], c:1, e:"Sa peau est noire pour absorber la chaleur du soleil.", img:"https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=500"},
        {q:"Quel serpent est le plus venimeux ?", a:["Cobra", "Taïpan du désert", "Mamba noir"], c:1, e:"Une seule morsure peut tuer 100 hommes.", img:"https://images.unsplash.com/photo-1531386151447-ad762e75f84e?w=500"},
        {q:"La girafe n'a que 7 vertèbres cervicales.", a:["Vrai", "Faux", "Elle en a 20"], c:0, e:"Comme l'humain ! Elles sont juste beaucoup plus grandes.", img:"https://images.unsplash.com/photo-1547721064-362036612442?w=500"},
        {q:"Quel poisson change de sexe ?", a:["Poisson-clown", "Requin", "Saumon"], c:0, e:"Si la femelle meurt, le mâle dominant devient une femelle.", img:"https://images.unsplash.com/photo-1524704654690-b56c05c78a00?w=500"},
        {q:"Le paresseux met combien de temps à digérer ?", a:["1 jour", "2 semaines", "1 mois"], c:1, e:"Son métabolisme est extrêmement lent.", img:"https://images.unsplash.com/photo-1519066629447-267ffbb62d4b?w=500"},
        {q:"L'autruche cache sa tête dans le sable.", a:["Vrai", "Faux", "Seulement en été"], c:1, e:"Elle pose sa tête au sol pour paraître un buisson, mais ne l'enterre pas.", img:"https://images.unsplash.com/photo-1551829141-86000030542c?w=500"},
        {q:"Quel mammifère vit le plus longtemps ?", a:["Éléphant", "Baleine boréale", "Humain"], c:1, e:"Elle peut vivre plus de 200 ans.", img:"https://images.unsplash.com/photo-1511216113906-8f57bb83e776?w=500"},
        {q:"Le koala n'est pas un ours.", a:["Vrai", "Faux", "C'est un rongeur"], c:0, e:"C'est un marsupial, comme le kangourou.", img:"https://images.unsplash.com/photo-1533513364213-39d675681121?w=500"},
        {q:"Le loup hurle à la lune.", a:["Vrai", "Faux", "Pour chanter"], c:1, e:"Il hurle pour communiquer, peu importe la lune.", img:"https://images.unsplash.com/photo-1589182397057-b16b77e10015?w=500"}
    ],
    [ // FORÊTS
        {q:"L'arbre respire par ses...", a:["Racines", "Feuilles", "Branches"], c:1, e:"Les feuilles captent le CO2 par des stomates.", img:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"},
        {q:"Quel est l'arbre le plus haut ?", a:["Chêne", "Séquoia", "Pin"], c:1, e:"L'Hyperion aux USA mesure plus de 115 mètres.", img:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=500"},
        {q:"Le liège vient de l'écorce du...", a:["Chêne", "Bouleau", "Sapin"], c:0, e:"On le récolte sur le chêne-liège.", img:"https://images.unsplash.com/photo-1596716790906-8488e04e4c84?w=500"},
        {q:"Combien de CO2 absorbe un arbre/an ?", a:["2kg", "25kg", "200kg"], c:1, e:"C'est une moyenne pour un arbre adulte.", img:"https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=500"},
        {q:"Le bambou est une herbe.", a:["Vrai", "Faux", "C'est un arbre"], c:0, e:"Il appartient à la famille des herbes géantes.", img:"https://images.unsplash.com/photo-1541018241434-7806f363065b?w=500"},
        {q:"D'où vient la cannelle ?", a:["D'une fleur", "D'une écorce", "D'une racine"], c:1, e:"C'est l'écorce du cannelier.", img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500"},
        {q:"Le séquoia peut vivre combien d'années ?", a:["500", "1500", "Plus de 3000"], c:2, e:"Certains ont plus de 3200 ans.", img:"https://images.unsplash.com/photo-1542202229-7d93c33f5d07?w=500"},
        {q:"L'humus est une couche de...", a:["Roche", "Terre de feuilles", "Sable"], c:1, e:"C'est de la matière organique décomposée.", img:"https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?w=500"},
        {q:"L'automne arrive quand l'arbre...", a:["A froid", "Manque de lumière", "Veut dormir"], c:1, e:"La lumière décline, la chlorophylle s'arrête.", img:"https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=500"},
        {q:"Qu'est-ce que le bois mort ?", a:["Un déchet", "Un habitat crucial", "Un danger"], c:1, e:"Crucial pour la biodiversité.", img:"https://images.unsplash.com/photo-1516214104703-d870798883c5?w=500"},
        {q:"La sève brute monte ou descend ?", a:["Monte", "Descend", "Reste immobile"], c:0, e:"Elle monte des racines vers les feuilles.", img:"https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=500"},
        {q:"Quel arbre produit des glands ?", a:["Frêne", "Hêtre", "Chêne"], c:2, e:"C'est le fruit du chêne.", img:"https://images.unsplash.com/photo-1582260273397-9097960e6533?w=500"},
        {q:"Les racines sont aussi grandes que la cime.", a:["Vrai", "Faux", "Parfois"], c:0, e:"Souvent le miroir souterrain de l'arbre.", img:"https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?w=500"},
        {q:"Quel pays a le plus de forêts ?", a:["Brésil", "Russie", "Canada"], c:1, e:"La Russie possède d'immenses forêts boréales.", img:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500"},
        {q:"Le gui est un parasite.", a:["Vrai", "Faux", "C'est un arbre"], c:0, e:"Il puise dans la sève des autres.", img:"https://images.unsplash.com/photo-1545161296-d9c2c241ec2b?w=500"},
        {q:"L'arbre du Canada est l'érable.", a:["Vrai", "Faux", "C'est le bouleau"], c:0, e:"Célèbre pour son sirop.", img:"https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=500"},
        {q:"Les champignons sont des plantes.", a:["Vrai", "Faux", "C'est entre les deux"], c:1, e:"C'est le règne Fungi.", img:"https://images.unsplash.com/photo-1504221507732-5246c045949b?w=500"},
        {q:"Le baobab stocke l'eau dans le tronc.", a:["Vrai", "Faux", "Dans les racines"], c:0, e:"Il peut stocker 120 000 litres.", img:"https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?w=500"},
        {q:"Le sapin perd ses aiguilles.", a:["Vrai", "Faux", "Tous les 10 ans"], c:1, e:"Il les garde grâce à une cire protectrice.", img:"https://images.unsplash.com/photo-1498100152307-ce63fd6c5424?w=500"},
        {q:"Forêt 'Primaire' signifie forêt vierge.", a:["Vrai", "Faux", "Forêt replantée"], c:0, e:"Elle n'a jamais été exploitée.", img:"https://images.unsplash.com/photo-1511497584788-876760111969?w=500"}
    ],
    [ // OCÉANS
        {q:"Profondeur de la fosse des Mariannes ?", a:["5 km", "11 km", "20 km"], c:1, e:"Le point le plus profond du monde.", img:"https://images.unsplash.com/photo-1518176258769-f227c798150e?w=500"},
        {q:"Qui produit le plus d'oxygène ?", a:["Forêts", "Phytoplancton", "Volcans"], c:1, e:"L'océan produit 1 respiration sur 2.", img:"https://images.unsplash.com/photo-1502675135487-e971002a6adb?w=500"},
        {q:"L'eau de mer gèle à...", a:["0°C", "-2°C", "-10°C"], c:1, e:"Le sel empêche l'eau de geler à 0°C.", img:"https://images.unsplash.com/photo-1482189349482-3defd547e0e9?w=500"},
        {q:"Plastique jeté en mer / an ?", a:["1 Mt", "8 Mt", "100 Mt"], c:1, e:"C'est un camion poubelle par minute.", img:"https://images.unsplash.com/photo-1530587191325-3db32d826c18?w=500"},
        {q:"Le Gulf Stream est un...", a:["Vent", "Courant marin", "Nuage"], c:1, e:"Il transporte la chaleur tropicale.", img:"https://images.unsplash.com/photo-1439405326854-014607f694d7?w=500"},
        {q:"Médusi immortelle ?", a:["Oui", "Non", "C'est un mythe"], c:0, e:"Turritopsis dohrnii peut rajeunir.", img:"https://images.unsplash.com/photo-1544317316-f2da0182d2b9?w=500"},
        {q:"On flotte dans la mer Morte.", a:["Vrai", "Faux", "Seulement le sel"], c:0, e:"Sa densité est extrême.", img:"https://images.unsplash.com/photo-1565551322746-9f79b291d3ec?w=500"},
        {q:"Plus grande structure vivante ?", a:["Amazonie", "Grande Barrière de Corail", "Séquoias"], c:1, e:"Faite de minuscules polypes.", img:"https://images.unsplash.com/photo-1546026423-9d703993043d?w=500"},
        {q:"L'océan est bleu car...", a:["Reflet du ciel", "Absorption du rouge", "À cause du sel"], c:1, e:"Le bleu est la couleur la moins absorbée.", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"},
        {q:"Combien de bras a une étoile de mer ?", a:["5", "Entre 5 et 40", "Toujours 10"], c:1, e:"C'est très variable selon les espèces.", img:"https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=500"},
        {q:"% des océans explorés ?", a:["5%", "50%", "95%"], c:0, e:"On connaît mieux Mars que nos fonds.", img:"https://images.unsplash.com/photo-1551244072-5d12893278ab?w=500"},
        {q:"Le narval a une corne.", a:["Vrai", "C'est une dent", "C'est un os"], c:1, e:"C'est une canine gauche géante.", img:"https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?w=500"},
        {q:"La baleine a des branchies.", a:["Vrai", "Faux", "Les deux"], c:1, e:"C'est un mammifère à poumons.", img:"https://images.unsplash.com/photo-1454991727061-be514eae86f7?w=500"},
        {q:"Le sel vient de l'érosion.", a:["Vrai", "Des poissons", "Des usines"], c:0, e:"Les rivières amènent les minéraux.", img:"https://images.unsplash.com/photo-1501430654243-c93f74b1c8c0?w=500"},
        {q:"Blanchissement du corail ?", a:["Il est propre", "Il meurt de chaud", "Il grandit"], c:1, e:"Dû au réchauffement des eaux.", img:"https://images.unsplash.com/photo-1546026423-9d703993043d?w=500"},
        {q:"Le Krill est une crevette.", a:["Vrai", "Faux", "Une algue"], c:0, e:"Base de la nourriture antarctique.", img:"https://images.unsplash.com/photo-1544317316-f2da0182d2b9?w=500"},
        {q:"L'Atlantique grandit.", a:["Vrai", "Faux", "Il rétrécit"], c:0, e:"Grâce à la dorsale centrale.", img:"https://images.unsplash.com/photo-1439405326854-014607f694d7?w=500"},
        {q:"Le son est plus vite dans l'eau.", a:["Vrai", "Faux", "Pareil"], c:0, e:"Environ 4 à 5 fois plus vite.", img:"https://images.unsplash.com/photo-1518176258769-f227c798150e?w=500"},
        {q:"Les marées viennent de la Lune.", a:["Vrai", "Du vent", "Du soleil"], c:0, e:"Attraction gravitationnelle.", img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=500"},
        {q:"Plus grand océan ?", a:["Atlantique", "Pacifique", "Indien"], c:1, e:"Il couvre 1/3 de la Terre.", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"}
    ]
];

let currentSet = [], idx = 0, score = 0;

function start(id) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    currentSet = data[id]; idx = 0; score = 0;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    show();
}

function startSurprise() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Mélange de toutes les questions
    let all = [...data[0], ...data[1], ...data[2]];
    all.sort(() => Math.random() - 0.5);
    currentSet = all.slice(0, 20); // On en prend 20 au hasard
    idx = 0; score = 0;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    show();
}

function show() {
    const q = currentSet[idx];
    document.getElementById('top-img').src = q.img;
    document.getElementById('progress').innerText = `QUESTION ${idx + 1} / 20`;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('expla-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    const list = document.getElementById('ans-list');
    list.innerHTML = '';
    q.a.forEach((ans, i) => {
        const b = document.createElement('button');
        b.className = 'ans-btn fade';
        b.innerText = ans;
        b.onclick = () => {
            const btns = list.querySelectorAll('button');
            btns.forEach(btn => btn.disabled = true);
            if(i === q.c) { b.classList.add('correct'); score++; play(600, 900); }
            else { b.classList.add('wrong'); btns[q.c].classList.add('correct'); play(300, 100); }
            document.getElementById('expla-text').innerText = q.e;
            document.getElementById('expla-box').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        };
        list.appendChild(b);
    });
}

function next() {
    idx++;
    if(idx < 20) show();
    else {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('note').innerText = score + "/20";
        document.getElementById('comment').innerText = score >= 16 ? "Légende de la Nature ! 🏆" : (score >= 10 ? "Bien joué ! 🌿" : "Essaye encore ! 🍂");
        play(400, 800);
    }
}
</script>
</body>
</html>
